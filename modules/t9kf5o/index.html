<section class="modulex-sss-dikey-yol{{fbsinif}}" {{fbetiket}}>

<style>
  /* sss-dikey-yol — sss-ziyaret-asama aşamaları yatay sekmelerle tek tek gösterir, sss-kategori-blok grupları ayrı bloklarda yapışkan başlıkla dizer; bu modülde tüm duraklar tek dikey yolda sırayla görünür — yol çizgisi + durak daireleri + soru noktaları, kaydırmayla dolan ilerleme çizgisi (süreç sırası önemli SSS). */
  .modulex-sss-dikey-yol { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sss-dikey-yol *, .modulex-sss-dikey-yol *::before, .modulex-sss-dikey-yol *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sss-dikey-yol :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sss-dikey-yol :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sss-dikey-yol :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sss-dikey-yol :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sss-dikey-yol img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sss-dikey-yol) img { height: auto; }
  .modulex-sss-dikey-yol [hidden] { display: none !important; }
  .modulex-sss-dikey-yol :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sss-dikey-yol :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sss-dikey-yol-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sss-dikey-yol-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sss-dikey-yol--bassiz .modulex-sss-dikey-yol-bas { display: none; }
  .modulex-sss-dikey-yol-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sss-dikey-yol-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sss-dikey-yol-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sss-dikey-yol-ic { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: clamp(32px, 5vw, 80px); align-items: start; }
  .modulex-sss-dikey-yol-bas { position: sticky; inset-block-start: 96px; margin: 0; }
  .modulex-sss-dikey-yol--bassiz .modulex-sss-dikey-yol-ic { grid-template-columns: minmax(0, 1fr); }
  .modulex-sss-dikey-yol-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sss-dikey-yol-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sss-dikey-yol-dugme:hover { transform: translateY(-2px); }
  .modulex-sss-dikey-yol-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sss-dikey-yol-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sss-dikey-yol-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sss-dikey-yol-yol { position: relative; display: grid; padding-inline-start: 76px; }
  .modulex-sss-dikey-yol-yol::before, .modulex-sss-dikey-yol-yol::after { content: ""; position: absolute; inset-inline-start: 27px; inset-block-start: 8px; width: 4px; border-radius: 4px; }
  .modulex-sss-dikey-yol-yol::before { inset-block-end: 8px; background-color: --cizgi--; }
  .modulex-sss-dikey-yol-yol::after { height: calc((100% - 16px) * var(--ilerleme, 1)); background-color: --accent--; transition: height 0.2s linear; }
  .modulex-sss-dikey-yol-durak { position: relative; padding-block-end: clamp(26px, 4vw, 44px); }
  .modulex-sss-dikey-yol-durak:last-child { padding-block-end: 0; }
  .modulex-sss-dikey-yol-dbas { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; min-height: 58px; margin-block-end: 12px; }
  .modulex-sss-dikey-yol-dno { position: absolute; z-index: 1; inset-inline-start: -76px; inset-block-start: 0; display: grid; place-items: center; width: 58px; height: 58px; border: 4px solid --bg--; border-radius: 50%; background-color: --vurguBg--; color: --vurguText--; font-size: 1.3rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .modulex-sss-dikey-yol-dad { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.25rem, 2.2vw, 1.6rem); font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
  .modulex-sss-dikey-yol-dsay { min-width: 30px; padding: 2px 10px; border: 1px solid --cizgi--; border-radius: 999px; color: --muted--; font-size: 0.82rem; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
  .modulex-sss-dikey-yol-dsorular { display: grid; gap: 10px; }
  .modulex-sss-dikey-yol-dsoru { position: relative; border-radius: --yuvarlak--; background-color: --kartBg--; transition: box-shadow 0.25s ease; }
  .modulex-sss-dikey-yol-dsoru[open] { box-shadow: 0 0 0 2px --accent--; }
  .modulex-sss-dikey-yol-dozet { display: flex; align-items: center; gap: 12px; padding: 16px 18px; list-style: none; font-weight: 700; line-height: 1.4; }
  .modulex-sss-dikey-yol-dozet::-webkit-details-marker { display: none; }
  .modulex-sss-dikey-yol-dnokta { position: absolute; inset-inline-start: -55px; inset-block-start: 21px; width: 14px; height: 14px; border: 3px solid --accent--; border-radius: 50%; background-color: --bg--; transition: background-color 0.25s ease, transform 0.25s ease; }
  .modulex-sss-dikey-yol-dsoru[open] .modulex-sss-dikey-yol-dnokta { background-color: --accent--; transform: scale(1.25); }
  .modulex-sss-dikey-yol-dyazi { flex: 1 1 auto; min-width: 0; }
  .modulex-sss-dikey-yol-dok { flex: none; color: --accentInk--; font-size: 22px; transition: transform 0.3s ease; }
  .modulex-sss-dikey-yol-dsoru[open] .modulex-sss-dikey-yol-dok { transform: rotate(45deg); }
  .modulex-sss-dikey-yol-dyanit { display: grid; gap: 8px; padding: 0 18px 18px; animation: modulex-sss-dikey-yol-yolgel 0.35s ease both; }
  .modulex-sss-dikey-yol-cevap { color: --muted--; line-height: 1.7; }
  @keyframes modulex-sss-dikey-yol-yolgel { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 768px) {
    .modulex-sss-dikey-yol-yol { padding-inline-start: 54px; }
    .modulex-sss-dikey-yol-yol::before, .modulex-sss-dikey-yol-yol::after { inset-inline-start: 18px; }
    .modulex-sss-dikey-yol-dno { inset-inline-start: -54px; width: 40px; height: 40px; border-width: 3px; font-size: 1rem; }
    .modulex-sss-dikey-yol-dbas { min-height: 40px; }
    .modulex-sss-dikey-yol-dnokta { inset-inline-start: -42px; }
    .modulex-sss-dikey-yol-dozet { padding: 14px; }
    .modulex-sss-dikey-yol-dyanit { padding: 0 14px 16px; }
  }
  .modulex-sss-dikey-yol-bag { display: inline-flex; align-items: center; gap: 6px; margin-block-start: 10px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.25s ease; }
  .modulex-sss-dikey-yol-bag:hover { gap: 10px; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-sss-dikey-yol-bag .material-symbols-outlined { font-size: 18px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sss-dikey-yol :is(.modulex-sss-dikey-yol-baslik, .modulex-sss-dikey-yol-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sss-dikey-yol-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-sss-dikey-yol-ic { grid-template-columns: minmax(0, 1fr); }
    .modulex-sss-dikey-yol-bas { position: static; margin-block-end: 32px; }
  }
  @media (max-width: 768px) {
    .modulex-sss-dikey-yol { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sss-dikey-yol *, .modulex-sss-dikey-yol *::before, .modulex-sss-dikey-yol *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sss-dikey-yol";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ilerleme = (s, P, az) => {
        if (az) { s.style.setProperty("--ilerleme", "1"); return; }
        let bekle = false;
        const hesap = () => {
          bekle = false;
          const r = s.getBoundingClientRect();
          const h = window.innerHeight || 1;
          const v = Math.min(1, Math.max(0, (h * 0.7 - r.top) / (r.height || 1)));
          s.style.setProperty("--ilerleme", v.toFixed(3));
        };
        window.addEventListener("scroll", () => { if (!bekle) { bekle = true; requestAnimationFrame(hesap); } }, { passive: true });
        hesap();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      ilerleme(s, P, az);
    });
  })();
</script>
