<script>
  (() => {
    const P = "modulex-referans-konveyor";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const konveyorDur = (s, P, az) => {
        const b = s.querySelector("[data-kv-dur]");
        if (!b || az) return;
        b.hidden = false;
        b.addEventListener("click", () => {
          const d = s.classList.toggle(P + "--durdu");
          b.setAttribute("aria-label", d ? b.dataset.oynaA : b.dataset.durA);
          const i = b.querySelector(".material-symbols-outlined");
          if (i) i.textContent = d ? "play_arrow" : "pause";
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      konveyorDur(s, P, az);
    });
  })();
</script>
